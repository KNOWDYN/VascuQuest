[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vascuquest"
version = "0.1.0.dev0"
description = "Scientific exploration and discovery for virtual vascular populations."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
keywords = [
    "haemodynamics",
    "hemodynamics",
    "pulse-wave",
    "scientific-computing",
    "vascular",
    "virtual-population",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0,<3",
    "platformdirs>=4,<5",
    "typer>=0.27,<1",
]

[project.scripts]
vascuquest = "vascuquest.cli.app:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.15",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.12",
]

[project.urls]
Repository = "https://github.com/KNOWDYN/VascuQuest"
Issues = "https://github.com/KNOWDYN/VascuQuest/issues"

[tool.setuptools.package-data]
vascuquest = ["schema/resources/*.json"]
