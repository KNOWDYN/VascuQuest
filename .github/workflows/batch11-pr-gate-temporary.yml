name: Batch 11 PR gate (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/vascuquest/methods/**'
      - 'tests/scientific/**'
      - 'src/vascuquest/services/execution.py'
      - 'src/vascuquest/bootstrap.py'
      - 'src/vascuquest/plugins/__init__.py'
      - 'tests/integration/**'
      - '.github/workflows/batch11-pr-gate-temporary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch11-gate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install package and test dependency
        run: python -m pip install -e . pytest
      - name: Run Batch 11 scientific component tests
        run: python -m pytest -q tests/scientific/test_reconstructions.py tests/contracts/test_ports.py tests/contracts/test_plugins.py
      - name: Run Batch 11 session integration tests
        run: python -m pytest -q tests/integration/test_batch11_flow_rate.py tests/integration/test_core_api.py
      - name: Run cumulative non-full-data regression suite
        run: python -m pytest -q --ignore=tests/full_data
