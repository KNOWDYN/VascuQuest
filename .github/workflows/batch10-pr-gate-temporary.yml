name: Batch 10 PR gate (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/contracts/test_batch10_public_surface.py'
      - 'tests/integration/test_core_api.py'
      - 'pyproject.toml'
      - '.github/workflows/batch10-pr-gate-temporary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch10-gate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install package and test dependency
        run: python -m pip install -e . pytest
      - name: Run Batch 10 contract and integration gate
        run: python -m pytest -q tests/contracts/test_batch10_public_surface.py tests/integration/test_core_api.py
