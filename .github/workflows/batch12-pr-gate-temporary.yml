name: Batch 12 PR gate (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  batch12-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and test dependency
        run: python -m pip install -e . pytest
      - name: Run Batch 12 direct exporter gate
        run: >-
          python -m pytest -q
          tests/exporters/test_exporters.py
          tests/contracts/test_ports.py
          tests/contracts/test_provenance.py
      - name: Run Batch 12 API integration gate
        run: >-
          python -m pytest -q
          tests/integration/test_exporter_api.py
          tests/integration/test_core_api.py
          tests/integration/test_batch11_flow_rate.py
          tests/contracts/test_batch10_public_surface.py
      - name: Run cumulative non-full-data regression suite
        run: python -m pytest -q --ignore=tests/full_data
