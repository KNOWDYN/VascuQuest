name: Batch 13 PR gate (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  batch13-pass:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and test dependency
        run: python -m pip install -e . pytest
      - name: Run Batch 13 executable smoke gate
        run: |
          python -m vascuquest --help > /tmp/module-help.txt
          vascuquest --help > /tmp/script-help.txt
          python -m vascuquest --version > /tmp/module-version.txt
          vascuquest --version > /tmp/script-version.txt
          diff -u /tmp/module-version.txt /tmp/script-version.txt
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          command_names = (
              'dataset', 'subjects', 'quantities', 'locations', 'get', 'waveform',
              'derive', 'model', 'discover', 'plugins', 'export', 'reproduce',
          )
          for help_path in (Path('/tmp/module-help.txt'), Path('/tmp/script-help.txt')):
              help_text = help_path.read_text(encoding='utf-8')
              for name in command_names:
                  assert name in help_text, (help_path, name)

          commands = (
              ['vascuquest', 'dataset', 'info', '--format', 'json'],
              ['vascuquest', 'quantities', '--format', 'jsonl'],
              ['vascuquest', 'plugins', 'list', '--format', 'jsonl'],
          )
          for args in commands:
              completed = subprocess.run(args, capture_output=True, text=True, check=False)
              assert completed.returncode == 0, (args, completed.stdout, completed.stderr)
              assert completed.stderr == '', (args, completed.stderr)
              if args[-1] == 'json':
                  json.loads(completed.stdout)
              else:
                  for line in completed.stdout.splitlines():
                      json.loads(line)
          PY
      - name: Run targeted Batch 13 CLI tests
        run: python -m pytest -q tests/cli
      - name: Run cumulative non-full-data regression suite
        run: python -m pytest -q tests
