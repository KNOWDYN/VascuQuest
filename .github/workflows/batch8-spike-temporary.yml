name: Batch 8 empirical ingestion spike (temporary)

on:
  push:
    branches:
      - build/batch-8-ingestion-spike
    paths:
      - '.github/workflows/batch8-spike-temporary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install spike readers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'scipy>=1.17,<2' 'h5py>=3.15,<4' 'wfdb>=4.3,<5'

      - name: Show runner storage
        run: df -h /

      - name: Download required canonical artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pwdb3275625"
          cd "$RUNNER_TEMP/pwdb3275625"
          base='https://zenodo.org/records/3275625/files'
          for file in \
            pwdb_model_configs.csv \
            geo.zip \
            PWs_csv.zip \
            PWs_wfdb.zip \
            pwdb_data.mat \
            pwdb_data_w_aorta_foot_path_p.mat
          do
            echo "Downloading $file"
            curl --location --fail --show-error --silent \
              --retry 6 --retry-all-errors --retry-delay 10 \
              --output "$file" "$base/$file?download=1"
            ls -lh "$file"
          done
          df -h /

      - name: Execute checksum-verified Tier-3 spike
        shell: bash
        run: |
          set -euo pipefail
          python tests/full_data/pwdb3275625_ingestion_spike.py \
            "$RUNNER_TEMP/pwdb3275625" \
            --report "$RUNNER_TEMP/pwdb3275625_ingestion_spike_report.json"

      - name: Preserve empirical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch8-ingestion-spike-report
          path: ${{ runner.temp }}/pwdb3275625_ingestion_spike_report.json
          if-no-files-found: warn
          retention-days: 7
