name: Temporary Zenodo relay 1163562

on:
  push:
    branches:
      - zenodo-relay-1163562-20261023

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - name: Fetch Zenodo record metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY'
          import json, os, requests
          record_url = 'https://zenodo.org/api/records/1163562'
          r = requests.get(record_url, timeout=120)
          r.raise_for_status()
          data = r.json()
          with open('zenodo_record_1163562.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          items=[]
          for i, item in enumerate(data.get('files', [])):
              links=item.get('links', {})
              url=links.get('content') or links.get('self')
              key=item.get('key') or item.get('filename') or f'file_{i}'
              items.append({
                  'i': i,
                  'key': key,
                  'url': url,
                  'checksum': item.get('checksum',''),
                  'size': item.get('size', item.get('filesize', 0))
              })
          matrix=json.dumps({'include':items}, separators=(',',':'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write('matrix='+matrix+'\n')
          with open('zenodo_file_manifest.json','w',encoding='utf-8') as f:
              json.dump(items,f,indent=2,ensure_ascii=False)
          print(f'Files discovered: {len(items)}')
          print(f'Total bytes: {sum(int(x.get("size") or 0) for x in items)}')
          for x in items:
              print(x['i'], x['key'], x['size'], x['checksum'])
          PY
      - name: Upload metadata
        uses: actions/upload-artifact@v7
        with:
          name: zenodo-record-metadata
          path: |
            zenodo_record_1163562.json
            zenodo_file_manifest.json
          retention-days: 1

  download:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify one Zenodo file
        env:
          ZENODO_URL: ${{ matrix.url }}
          ZENODO_KEY: ${{ matrix.key }}
          ZENODO_CHECKSUM: ${{ matrix.checksum }}
          ZENODO_SIZE: ${{ matrix.size }}
          ZENODO_INDEX: ${{ matrix.i }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, requests, sys
          url=os.environ['ZENODO_URL']
          key=os.environ['ZENODO_KEY']
          checksum=os.environ.get('ZENODO_CHECKSUM','')
          expected_size=int(os.environ.get('ZENODO_SIZE') or 0)
          idx=os.environ['ZENODO_INDEX']
          outdir=pathlib.Path('downloads')/idx
          outdir.mkdir(parents=True,exist_ok=True)
          out=outdir/key
          h=hashlib.md5()
          n=0
          with requests.get(url,stream=True,timeout=(60,600),allow_redirects=True) as r:
              r.raise_for_status()
              with open(out,'wb') as f:
                  for chunk in r.iter_content(chunk_size=8*1024*1024):
                      if not chunk: continue
                      f.write(chunk); h.update(chunk); n += len(chunk)
          actual='md5:'+h.hexdigest()
          if expected_size and n != expected_size:
              raise SystemExit(f'size mismatch: {n} != {expected_size}')
          if checksum and checksum.lower() != actual.lower():
              raise SystemExit(f'checksum mismatch: {actual} != {checksum}')
          manifest={'index':int(idx),'key':key,'source_url':url,'expected_size':expected_size,'actual_size':n,'expected_checksum':checksum,'actual_checksum':actual,'verified':True}
          with open(outdir/'TRANSFER.json','w',encoding='utf-8') as f:
              json.dump(manifest,f,indent=2)
          print(json.dumps(manifest,indent=2))
          PY
      - name: Upload verified file
        uses: actions/upload-artifact@v7
        with:
          name: zenodo-file-${{ matrix.i }}
          path: downloads/${{ matrix.i }}/
          retention-days: 1
          compression-level: 0
