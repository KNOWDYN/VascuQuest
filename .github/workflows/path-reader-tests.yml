name: Path Reader Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: path-reader-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-path-reader:
    name: Synthetic MATLAB v7.3 path reader
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package with optional path support
        run: python -m pip install '.[path]' pytest
      - name: Run Batch 9 path tests
        run: >-
          python -m pytest -q
          tests/unit/test_batch9_path_mapping.py
          tests/unit/test_http_range_reader.py
          tests/integration/test_batch9_path_reader.py
          tests/cli/test_cli_safety.py

  remote-hdf5-profile:
    name: Remote HDF5 operation profile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package with path support
        run: python -m pip install '.[path]'
      - name: Compile profiler and canonical validator
        run: >-
          python -m py_compile
          tests/full_data/path_release_validation.py
          tests/full_data/path_remote_profile.py
      - name: Profile canonical path_aorta_brain traversal
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/vascuquest-profile/data
          XDG_CACHE_HOME: ${{ runner.temp }}/vascuquest-profile/cache
          XDG_STATE_HOME: ${{ runner.temp }}/vascuquest-profile/state
        run: >-
          python tests/full_data/path_remote_profile.py
          --artifact-id path_aorta_brain
