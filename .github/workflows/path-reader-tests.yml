name: Path Reader Tests

on:
  push:
    branches: [build/batch-9-production-path-reader]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: path-reader-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-path-reader:
    name: Synthetic MATLAB v7.3 path reader
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package with optional path support
        run: python -m pip install '.[path]' pytest
      - name: Run Batch 9 path tests
        run: >-
          python -m pytest -q
          tests/unit/test_batch9_path_mapping.py
          tests/unit/test_http_range_reader.py
          tests/integration/test_batch9_path_reader.py
          tests/cli/test_cli_safety.py

  sparse-tier4:
    name: Sparse canonical Tier-4
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package with path support
        run: python -m pip install '.[path]'
      - name: Compile Tier-4 validator
        run: python -m py_compile tests/full_data/path_release_validation.py
      - name: Validate all six canonical path artifacts without full downloads
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/vascuquest-tier4/data
          XDG_CACHE_HOME: ${{ runner.temp }}/vascuquest-tier4/cache
          XDG_STATE_HOME: ${{ runner.temp }}/vascuquest-tier4/state
        run: |
          set -euo pipefail
          for artifact in \
            path_aorta_brain \
            path_aorta_finger \
            path_aorta_foot_a \
            path_aorta_foot_p \
            path_aorta_foot_u \
            path_aorta_rsubclavian
          do
            echo "=== Validating ${artifact} ==="
            python tests/full_data/path_release_validation.py \
              --artifact-id "${artifact}" \
              --report "reports/${artifact}.json"
          done
      - name: Upload Tier-4 reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: path-tier4-reports
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 14
