name: Deploy VascuQuest website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "README.md"
      - "docs/*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble Pages artifact
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/vascuquest-pages"
          cp -R site "$RUNNER_TEMP/vascuquest-pages"

          # Keep the repository documentation reachable from the Pages origin
          # while the public website remains a deliberately small static build.
          cp README.md "$RUNNER_TEMP/vascuquest-pages/README.md"
          mkdir -p "$RUNNER_TEMP/vascuquest-pages/docs"
          cp docs/*.md "$RUNNER_TEMP/vascuquest-pages/docs/"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/vascuquest-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
