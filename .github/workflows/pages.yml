name: Deploy VascuQuest website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "README.md"
      - "docs/*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble Pages artifact
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/vascuquest-pages"
          cp -R site "$RUNNER_TEMP/vascuquest-pages"

          # Package the repository Markdown documentation into the Pages origin so
          # the VascuQuest documentation reader never needs to navigate to GitHub.
          cp README.md "$RUNNER_TEMP/vascuquest-pages/README.md"
          mkdir -p "$RUNNER_TEMP/vascuquest-pages/docs"
          cp docs/*.md "$RUNNER_TEMP/vascuquest-pages/docs/"

          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          assets = Path(__import__('os').environ['RUNNER_TEMP']) / 'vascuquest-pages' / 'assets'
          parts = [assets / f'Arterial_System.part{i}.svg' for i in range(1, 6)]
          ns = 'http://www.w3.org/2000/svg'
          ET.register_namespace('', ns)
          root = ET.Element(f'{{{ns}}}svg', {
              'viewBox': '-137 -577 1000 2000',
              'width': '1000',
              'height': '2000',
              'role': 'img',
              'aria-label': 'Arterial system',
          })
          for part in parts:
              part_root = ET.parse(part).getroot()
              for child in list(part_root):
                  root.append(child)
          ET.ElementTree(root).write(assets / 'Arterial_System.svg', encoding='utf-8', xml_declaration=True)
          for part in parts:
              part.unlink()
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/vascuquest-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
