name: Parameterized cohort real-source qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-pwdb-cohort:
    name: PWDB Virtual Disease cohort qualification / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout qualification candidate
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile qualification harnesses
        run: |
          python -m py_compile tests/full_data/parameterized_cohort_release_validation.py
          python -m py_compile tests/full_data/parameterized_cohort_colab_validation.py

      - name: Install qualification candidate
        run: python -m pip install .

      - name: Confirm parameterized cohort CLI surface
        run: |
          python -m vascuquest disease cohort --help
          vascuquest disease cohort plan --help
          vascuquest disease cohort generate --help
          vascuquest disease cohort inspect --help
          vascuquest disease cohort verify --help

      - name: Run canonical PWDB cohort qualification
        shell: bash
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/vascuquest-xdg/data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/vascuquest-xdg/cache"
          export XDG_STATE_HOME="$RUNNER_TEMP/vascuquest-xdg/state"
          python tests/full_data/parameterized_cohort_release_validation.py \
            --report parameterized-cohort-qualification.json \
            --workspace "$RUNNER_TEMP/parameterized-cohort-qualification" \
            --code-revision "${{ github.sha }}"

      - name: Print qualification summary
        if: always()
        shell: bash
        run: |
          if [ -f parameterized-cohort-qualification.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          path = Path('parameterized-cohort-qualification.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          print(json.dumps({
              'status': payload.get('status'),
              'code_revision': payload.get('code_revision'),
              'elapsed_seconds': payload.get('elapsed_seconds'),
              'qualification_scope': payload.get('qualification_scope'),
          }, indent=2, sort_keys=True))
          PY
          fi

      - name: Upload machine-readable qualification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vascuquest-parameterized-cohort-qualification
          path: parameterized-cohort-qualification.json
          if-no-files-found: error
          retention-days: 90
