name: Path Tier-4 Validation

on:
  push:
    branches:
      - build/batch-9-production-path-reader
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sparse-canonical-path-validation:
    name: Sparse canonical path validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      XDG_DATA_HOME: ${{ runner.temp }}/vascuquest-tier4/data
      XDG_CACHE_HOME: ${{ runner.temp }}/vascuquest-tier4/cache
      XDG_STATE_HOME: ${{ runner.temp }}/vascuquest-tier4/state
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Report storage before validation
        run: df -h .
      - name: Install package with path support
        run: python -m pip install '.[path]'
      - name: Compile sparse path implementation and validator
        run: |
          python -m py_compile \
            src/vascuquest/backends/pwdb3275625/http_range.py \
            src/vascuquest/backends/pwdb3275625/path_reader.py \
            src/vascuquest/backends/pwdb3275625/path_backend.py \
            src/vascuquest/data/acquisition.py \
            tests/full_data/path_release_validation.py
      - name: Validate all six canonical path artifacts sparsely
        run: |
          set -euo pipefail
          for artifact in \
            path_aorta_brain \
            path_aorta_finger \
            path_aorta_foot_a \
            path_aorta_foot_p \
            path_aorta_foot_u \
            path_aorta_rsubclavian
          do
            echo "=== Validating ${artifact} ==="
            python tests/full_data/path_release_validation.py \
              --artifact-id "${artifact}" \
              --report "reports/${artifact}.json"
          done
      - name: Report storage after validation
        if: always()
        run: df -h .
      - name: Upload Tier-4 reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: path-tier4-reports
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 14
