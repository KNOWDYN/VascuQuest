  <use xlink:href="#m1" class="major"/>
  <use xlink:href="#aca" class="middle"/>
  <path class="fine" d="M335 204C310 185 297 160 299 130C300 105 311 90 323 74"/>
  <path class="fine" d="M343 139C368 120 376 104 379 80"/>
  <path class="fine" d="M369 270C358 250 345 239 322 237C299 234 282 228 267 213"/>
  <path class="fine" d="M330 332C300 322 280 315 264 294C253 280 243 265 225 255"/>
  <path class="fine" d="M340 422C372 433 386 455 395 480"/>
  <path class="fine" d="M300 371C283 382 261 389 244 384"/>
  <path class="fine" d="M332 214C312 207 298 204 282 195"/>
</g>
<!-- Contrast stops at the blockage and advances only through the patent proximal route. -->
<use xlink:href="#proximalContrast" class="flow-glow"/>
<use xlink:href="#proximalContrast" class="contrast"/>
<!-- Catheter runs from the cervical ICA, through the siphon and into the proximal M1. -->
<use xlink:href="#navigationPath" class="catheter-rest"/>
<path class="catheter" d="M319 663 C319 606 302 557 311 517 C321 476 355 462 346 422 C342 398 313 398 309 371 C303 347 321 330 349 326 C379 321 385 301 374 275 C394 266 417 258 435 253" pathLength="100"/>
<!-- Focal M1 occlusion. -->
<circle cx="445" cy="248" r="31" class="clot-ring"/>
<circle cx="445" cy="248" r="18" class="clot-halo"/>
<path d="M438 243Q444 236 452 241Q458 249 452 256Q445 262 437 254Q432 249 438 243Z" fill="#bc6570" stroke="#f0b9aa" stroke-width="1.4"/>
<g class="line">
  <path d="M459 244L503 206H584"/>
  <path d="M326 488L232 521H106"/>
  <path d="M334 170L262 139H195"/>
  <path d="M483 259L526 302H599"/>
</g>
<g class="anno">
  <text x="506" y="193" fill="#f0b9aa">M1 / OCCLUSION</text>
  <text x="104" y="513">ICA ACCESS</text>
  <text x="139" y="132">ACA / A2</text>
  <text x="529" y="315">MCA TERRITORY</text>
</g>
<g class="clinical">
  <text x="48" y="50">DSA-INSPIRED NEUROVASCULAR VIEW</text>
  <text x="48" y="68" class="dim">ANTERIOR CIRCULATION  •  AP PROJECTION</text>
  <text x="46" y="646" class="dim">MICROCATHETER APPROACH / M1</text>
  <text x="615" y="646" text-anchor="end">VQ / 001</text>
</g>
<path d="M47 86V104H68M613 86V104H593M47 616V598H68M613 616V598H593" fill="none" stroke="#8eacb4" stroke-width="1.5" stroke-opacity=".6"/>
</svg>